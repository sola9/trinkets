<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScatGPT</title>
    <link rel="icon" type="image/x-icon" href="scatgpt_favicon.ico">
    <link rel="stylesheet" href="scatStyle.css">
    <script src="scatGPT.js"></script>
    <script
        src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
        crossorigin="anonymous"></script>
</head>
<body onload="get_poop();document.getElementById('second_prompt').style.display = 'none';">
    <div id="first_prompt" class="first_prompt">
        <h2>What's on your mind today?</h2>
        <input type="text" id="prompt_input" name="prompt_input" placeholder="Ask ScatGPT" class="first_input_box">
        <input type="submit" value=" 🡡 " onclick="receive_prompt(document.getElementById('prompt_input').value)" class="first_input_button">
        <p class="suggestion" onclick="receive_prompt('What should I have for lunch?')">🥪 What should I have for lunch?</p>
        <p class="suggestion" onclick="receive_prompt('What do you think of my outfit?')">👔 What do you think of my outfit?</p>
        <p class="suggestion" onclick="receive_prompt('Show me something inspiring')">🌅 Show me something inspiring</p>
    </div>
    <div id="oak"></div>
    <p class="disclaimer" id="disclaimer">ScatGPT never makes mistakes. Your data isn't used to train anything.</p>
    <div class="second_prompt" id="second_prompt">
        <input type="text" id="prompt_input2" name="prompt_input" placeholder="Ask ScatGPT" class="second_input_box">
        <input type="submit" value=" 🡡 " onclick="receive_prompt(document.getElementById('prompt_input2').value)" class="first_input_button">
    </div>
</body>
</html>
